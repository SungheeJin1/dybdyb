name: 학생 제출 알림

on:
  # 실행 시각은 cron-job.org가 정합니다(매일 16:00~00:50 KST, 10분마다 이 워크플로를 실행).
  # GitHub 자체 예약(schedule)은 이 저장소에서 거의 돌지 않거나 엉뚱한 시각에 돌아서 쓰지 않습니다.
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식'
        type: choice
        default: run
        options:
          - run
          - test-notify
          - dry-run

concurrency:
  group: dyb-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci --no-audit --no-fund

      - name: 저장된 상태 불러오기
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: dyb-watch-state-${{ github.run_id }}
          restore-keys: dyb-watch-state-

      # 로그는 공개 저장소에서 누구나 볼 수 있으므로 프로그램은 건수만 출력합니다.
      # Secret 값은 GitHub가 로그에서 자동으로 *** 로 가립니다.
      - name: 학생 피드백 확인
        env:
          MODE: ${{ inputs.mode || 'run' }}
          WIX_COOKIES: ${{ secrets.WIX_COOKIES }}
          WIX_EMAIL: ${{ secrets.WIX_EMAIL }}
          WIX_PASSWORD: ${{ secrets.WIX_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TARGET_NAMES: ${{ secrets.TARGET_NAMES }}
          STATE_SECRET: ${{ secrets.STATE_SECRET }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          WATCH_STATUSES: ${{ vars.WATCH_STATUSES }}
          NOTIFY_EXISTING: ${{ vars.NOTIFY_EXISTING }}
          SITE_URL: ${{ vars.SITE_URL }}
          CLICK_URL: ${{ vars.CLICK_URL }}
          # GitHub 실행 환경에 이미 설치된 Chrome을 씁니다(브라우저 다운로드 시간 절약).
          BROWSER_CHANNEL: chrome
        run: |
          case "$MODE" in
            test-notify) node src/index.js --test-notify ;;
            dry-run)     node src/index.js --dry-run ;;
            *)           node src/index.js ;;
          esac

      - name: 상태 저장
        if: always() && hashFiles('.state/state.bin') != ''
        uses: actions/cache/save@v4
        with:
          path: .state
          key: dyb-watch-state-${{ github.run_id }}-${{ github.run_attempt }}

