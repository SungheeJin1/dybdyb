name: 학생 제출 알림

on:
  schedule:
    # GitHub 예약 실행은 UTC 기준입니다(한국 시간 = UTC + 9).
    # 한국 시간 07:03 ~ 다음날 00:53, 10분마다 (매시 3·13·23·33·43·53분).
    # 정각은 GitHub 서버가 붐벼 늦어지기 쉬워서 3분씩 비켜 놓았습니다.
    - cron: '3,13,23,33,43,53 22-23,0-15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식'
        type: choice
        default: run
        options:
          - run
          - test-notify
          - dry-run

concurrency:
  group: dyb-watch
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # 예약 실행이 60일 뒤 꺼지지 않게 다시 켜는 데 필요

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci --no-audit --no-fund

      - name: 저장된 상태 불러오기
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: dyb-watch-state-${{ github.run_id }}
          restore-keys: dyb-watch-state-

      # 로그는 공개 저장소에서 누구나 볼 수 있으므로 프로그램은 건수만 출력합니다.
      # Secret 값은 GitHub가 로그에서 자동으로 *** 로 가립니다.
      - name: 학생 피드백 확인
        env:
          MODE: ${{ inputs.mode || 'run' }}
          WIX_COOKIES: ${{ secrets.WIX_COOKIES }}
          WIX_EMAIL: ${{ secrets.WIX_EMAIL }}
          WIX_PASSWORD: ${{ secrets.WIX_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TARGET_NAMES: ${{ secrets.TARGET_NAMES }}
          STATE_SECRET: ${{ secrets.STATE_SECRET }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          WATCH_STATUSES: ${{ vars.WATCH_STATUSES }}
          NOTIFY_EXISTING: ${{ vars.NOTIFY_EXISTING }}
          SITE_URL: ${{ vars.SITE_URL }}
          CLICK_URL: ${{ vars.CLICK_URL }}
          # GitHub 실행 환경에 이미 설치된 Chrome을 씁니다(브라우저 다운로드 시간 절약).
          BROWSER_CHANNEL: chrome
        run: |
          case "$MODE" in
            test-notify) node src/index.js --test-notify ;;
            dry-run)     node src/index.js --dry-run ;;
            *)           node src/index.js ;;
          esac

      - name: 상태 저장
        if: always() && hashFiles('.state/state.bin') != ''
        uses: actions/cache/save@v4
        with:
          path: .state
          key: dyb-watch-state-${{ github.run_id }}-${{ github.run_attempt }}

      # 공개 저장소의 예약 실행은 저장소에 60일간 변화가 없으면 GitHub가 끕니다.
      # 매주 월요일 아침에 워크플로를 다시 켜 두어 꺼지지 않게 합니다.
      - name: 예약 실행 유지
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Asia/Seoul date +%u%H)" = "107" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watch.yml/enable" \
              && echo "예약 실행 유지 완료" || echo "예약 실행 유지 실패(무시)"
          fi
